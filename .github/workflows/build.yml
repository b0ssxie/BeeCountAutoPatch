name: Build

# 任何分支的 push、任何 PR 都构建；推 v* tag 时额外发 Release。
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，推得勤也不会排队堆积。
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Test & build APKs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 装上 cmdline-tools 并配好 PATH，下面的 sdkmanager 才一定可用。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' > /dev/null

      # 缓存 debug 签名密钥：release 复用这把签名，缓存住才能让各次构建的包
      # 互相覆盖安装。缓存被清掉时签名会变，届时需要先卸载旧版本。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 缓存没命中的首次构建要自己生成，否则 release 签名会失败。
      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 仓库里没有 Gradle wrapper，所以由 action 装一个固定版本（与 README 一致）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # release 开了 R8 + 资源压缩，体积明显更小，是推荐安装的那份；
      # debug 保留一份不做混淆的，方便排查「是不是混淆导致的问题」。
      - name: Assemble APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      # 新版 API 的模块元数据必须实实在在打进 APK，否则装到手机上框架根本不认这个模块，
      # 而那种失败在本地编译阶段是看不出来的，所以这里直接在构建时验一遍。
      - name: Verify module metadata inside APK
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          missing=0
          for f in java_init.list module.prop scope.list; do
            if ! unzip -l "$apk" | grep -q "META-INF/xposed/$f"; then
              echo "::error::APK 里缺少 META-INF/xposed/$f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            unzip -l "$apk" | grep -i 'META-INF/' || true
            exit 1
          fi
          {
            echo "### APK 内的模块元数据"
            echo '```'
            for f in java_init.list module.prop scope.list; do
              echo "--- $f"
              unzip -p "$apk" "META-INF/xposed/$f"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # PR 的 GITHUB_REF_NAME 形如 "123/merge"，斜杠不能出现在文件名里。
      - name: Collect APKs
        run: |
          mkdir -p dist
          suffix="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BeeCountAutoPatch-${suffix}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/BeeCountAutoPatch-${suffix}-release.apk"
          ls -lh dist
          {
            echo "### APK 体积"
            echo '```'
            ls -lh dist | awk '{print $5 "\t" $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeCountAutoPatch-release
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeCountAutoPatch-debug
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Attach APKs to release
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 生成「本次变更」要能拿到上一个标签，所以要完整历史。
          fetch-depth: 0

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Release 页面是用户下载的主要入口，所以把安装说明和变更列表一起写进去。
      - name: Build release notes
        run: |
          {
            echo "### 安装包"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`*-release.apk\` | **推荐**：R8 代码压缩 + 资源压缩，体积最小 |"
            echo "| \`*-debug.apk\` | 不混淆，用来排查「是不是混淆导致的问题」 |"
            echo
            echo "### 安装前确认"
            echo
            echo "- 需要 **Root + 支持新版 libxposed API 的 LSPosed**（模块 \`minApiVersion=101\` / \`targetApiVersion=102\`，旧框架看不到本模块）；"
            echo "- 自动记账需为 **4.0.x**，蜜蜂记账需含 \`beecount://add\` 深链；"
            echo "- 各次 CI 构建签名一致，可以直接覆盖安装；如果从本地自建版升级提示签名不一致，先卸载旧版本。"
            echo
            echo "### 本次变更"
            echo
            prev="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
            if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD"; fi
            git log --no-merges --pretty='- %s' "$range" | head -50 || true
            echo
            echo "详细说明见 [README](https://github.com/${{ github.repository }}#readme)。"
          } > RELEASE_BODY.md
          cat RELEASE_BODY.md

      # action-gh-release 对「已存在」的 Release 只会更新附件、不会改正文（实测如此），
      # 所以先删掉同名 Release（保留 tag），让下面的步骤按最新的正文重建。
      - name: Drop existing release (keep tag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-release.apk
            dist/*-debug.apk
          body_path: RELEASE_BODY.md