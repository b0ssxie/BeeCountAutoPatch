name: Build

# 任何分支的 push、任何 PR 都构建；推 v* tag 时额外发 Release。
on:
  push:
  pull_request:
  workflow_dispatch:

# 同一分支/PR 只保留最新一次构建，推得勤也不会排队堆积。
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: "Test & build APKs"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 装上 cmdline-tools 并配好 PATH，下面的 sdkmanager 才一定可用。
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Android SDK 35
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0' > /dev/null

      # 缓存 debug 签名密钥：release 复用这把签名，缓存住才能让各次构建的包
      # 互相覆盖安装。缓存被清掉时签名会变，届时需要先卸载旧版本。
      - name: Cache debug keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # 缓存没命中的首次构建要自己生成，否则 release 签名会失败。
      - name: Ensure debug keystore
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # 仓库里没有 Gradle wrapper，所以由 action 装一个固定版本（与 README 一致）。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      # release 开了 R8 + 资源压缩，体积明显更小，是推荐安装的那份；
      # debug 保留一份不做混淆的，方便排查「是不是混淆导致的问题」。
      - name: Assemble APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      # PR 的 GITHUB_REF_NAME 形如 "123/merge"，斜杠不能出现在文件名里。
      - name: Collect APKs
        run: |
          mkdir -p dist
          suffix="$(echo "$GITHUB_REF_NAME" | tr '/' '-')"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/BeeCountAutoPatch-${suffix}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/BeeCountAutoPatch-${suffix}-release.apk"
          ls -lh dist
          {
            echo "### APK 体积"
            echo '```'
            ls -lh dist | awk '{print $5 "\t" $9}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeCountAutoPatch-release
          path: dist/*-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BeeCountAutoPatch-debug
          path: dist/*-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Attach APKs to release
    if: "startsWith(github.ref, 'refs/tags/v')"
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-release.apk
            dist/*-debug.apk
          generate_release_notes: true